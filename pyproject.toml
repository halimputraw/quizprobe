[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quizprobe"
version = "0.1.0"
description = "Reviews students' Jupyter quiz answers with any Google Gemini model and gives a short post-quiz on their misconceptions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["jupyter", "education", "quiz", "teaching", "gemini", "google-gemini", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Topic :: Education",
]

[project.optional-dependencies]
widgets = ["ipywidgets"]

[project.urls]
Homepage = "https://github.com/halimputraw/quizprobe"
Issues = "https://github.com/halimputraw/quizprobe/issues"

[tool.setuptools]
py-modules = ["quizprobe"]
